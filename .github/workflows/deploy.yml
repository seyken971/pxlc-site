name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# contents: read au niveau global (checkout dans build).
# pages: write + id-token: write limités au job deploy uniquement.
permissions:
  contents: read

# Groupe scopé par ref pour que les PRs Dependabot ne s'annulent pas mutuellement
# ni le run main. cancel-in-progress conditionnel à la ref :
#   - main = déploiement de production : on NE coupe JAMAIS un run en cours,
#     sinon actions/deploy-pages émet « Deployment cancelled ». Les pushes main
#     successifs se mettent en file au lieu de s'annuler — le dernier gagne.
#   - PR / branches : on garde l'annulation des runs redondants (économie CI).
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Historique complet : les <lastmod> des pages statiques du sitemap
          # viennent de la date du dernier commit touchant chaque page
          # (scripts/sitemap-lastmod.mjs). Sur le clone superficiel par défaut,
          # cette date est introuvable et tout retombe sur l'horodatage du
          # build.
          fetch-depth: 0

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        # npm ci : installation depuis le lockfile, sans le résoudre à nouveau.
        # Déclenche le postinstall `astro sync`.
        run: npm ci --no-audit --no-fund

      - name: Check (lint, typecheck, build + gates, a11y)
        # La commande locale, rejouée telle quelle :
        #   lint → typecheck → build → a11y (jsdom)
        # avec les hooks npm du build :
        #   prebuild  = gen:tokens → design → ds-lint
        #   build     = astro build (pages statiques dans dist/)
        #   postbuild = check-links (dont les fichiers que Pages exige :
        #               .nojekyll, CNAME, robots, sitemap) → schema-check →
        #               seo-lint →
        #               seo-check (dist contre docs/seo-baseline : une PR qui
        #               change le SEO sans recapturer la baseline échoue ici)
        run: npm run check

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright Chromium
        # Sans --with-deps : les libs système de Chromium sont déjà sur l'image
        # ubuntu-latest, et l'apt-get du flag peut figer le job. Si une future
        # image perd une lib, remettre
        # `--with-deps` avec DEBIAN_FRONTEND=noninteractive et NEEDRESTART_MODE=a.
        timeout-minutes: 5
        run: npx playwright install chromium

      - name: A11y audit (axe-core + headless Chromium)
        # Complète l'audit jsdom de `npm run check` par les règles qui exigent
        # un vrai navigateur (color-contrast, target-size) et les états
        # dynamiques (menu mobile ouvert, FAQ dépliée).
        run: npm run a11y:runtime

      - name: Setup Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v6

      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment-retry.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        # continue-on-error : un échec transitoire de Pages (statut `error`
        # immédiat ou `deployment_queued` jusqu'au timeout) ne fait pas tomber
        # le job — l'étape de retry ci-dessous relance un déploiement propre.
        continue-on-error: true

      # Retry unique. `steps.deployment.outcome` reflète le résultat réel de
      # l'étape (`failure`) même quand `continue-on-error` masque son
      # `conclusion` en `success`. Pas de continue-on-error ici : un second
      # échec fait tomber le job, on ne masque donc pas une vraie panne Pages.
      - name: Deploy to GitHub Pages (retry)
        id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
