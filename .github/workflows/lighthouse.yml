name: Lighthouse (weekly)

# Chaque dimanche à 18:00 UTC et à la demande. Hors du déploiement : lent et
# bruité en localhost, il ne bloque pas les PR. Tableau Markdown dans le
# résumé du run, informatif uniquement.

on:
  schedule:
    - cron: '0 18 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lighthouse
  cancel-in-progress: false

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build static site
        run: npm run build

      - name: Run Lighthouse
        # chrome-launcher utilise le Chrome stable de l'image ubuntu-latest.
        run: npm run lighthouse
        continue-on-error: true
